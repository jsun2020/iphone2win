<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iphone2win</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin: 0 0 22px;
      color: GrayText;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      min-height: 46px;
      font: inherit;
      border-radius: 8px;
    }

    input {
      border: 1px solid ButtonBorder;
      padding: 10px;
      background: Field;
      color: FieldText;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #00796b;
      color: white;
      font-weight: 700;
    }

    button:disabled {
      opacity: .55;
    }

    #status {
      margin-top: 22px;
      padding: 0;
      list-style: none;
    }

    #status li {
      padding: 10px 0;
      border-top: 1px solid ButtonBorder;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>iphone2win</h1>
    <p>Select files on this device and send them directly to the Windows receiver on your local network.</p>

    <label for="files">Files</label>
    <input id="files" type="file" multiple>

    <label for="pin">PIN</label>
    <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Optional receive PIN">

    <button id="send" type="button">Send files</button>
    <ul id="status" aria-live="polite"></ul>
  </main>
  <script src="/upload.js"></script>
</body>
</html>
