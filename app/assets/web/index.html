<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iphone2win</title>
    <style>
        body {
            font-family: sans-serif, system-ui;
            margin: 0;
            line-height: 1.5;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #FFFFFF;
        }

        button {
            box-sizing: border-box;
            min-height: 44px;
            border: 0;
            border-radius: 0.5em;
            font: inherit;
            font-weight: 700;
        }

        #file-list {
            box-sizing: border-box;
            width: 100%;
            max-width: 1000px;
            padding: 0 1em;
            margin: 0 auto;
            text-align: left;
        }

        .file-item {
            display: table;
            width: 100%;
            padding: 0.5em 1em;
            background-color: #00796B;
            border-radius: 0.5em;
            margin-bottom: 1em;
            float: left;
            box-sizing: border-box;
        }

        .file-item:hover {
            background-color: #009688;
        }

        .file-name-cell, .file-size-cell, .file-index-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .file-name-cell {
            width: 100%;
            padding: 0 0.5em;
        }

        .file-size-cell, .file-index-cell {
            font-size: 0.8em;
            white-space: nowrap;
            color: #E0E0E0;
        }

        /* Two columns layout */
        .file-item {
            width: 100%;
        }

        @media screen and (min-width: 768px) {
            #file-list.file-item {
                width: 48%;
                margin-right: 2%;
            }
            #file-list.file-item:nth-child(2n) {
                margin-right: 0;
            }
        }

        /* Single file mode */

        #single-file {
            box-sizing: border-box;
            width: 100%;
            text-align: left;
            max-width: 700px;
            padding: 0 1em;
            margin: 0 auto;
        }

        .text-item {
            box-sizing: border-box;
            width: 100%;
            max-width: 700px;
            padding: 0 1em 1em;
            margin: 0 auto 1em;
            text-align: left;
        }

        .text-preview {
            box-sizing: border-box;
            width: 100%;
            min-height: 180px;
            padding: 0.8em;
            border: 1px solid #B0BEC5;
            border-radius: 0.5em;
            background: #FAFAFA;
            color: #111111;
            font: 16px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
            resize: vertical;
            white-space: pre-wrap;
        }

        .copy-text-button,
        .text-download-link {
            display: block;
            box-sizing: border-box;
            width: 100%;
            margin-top: 0.75em;
            padding: 0.7em 1em;
            text-align: center;
            background-color: #00796B;
            color: #FFFFFF;
        }

        .copy-text-button:hover,
        .text-download-link:hover {
            background-color: #009688;
        }
    </style>
    <script src="main.js" defer></script>
</head>
<body>
<noscript>
    iphone2win requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

<h1 style="padding: 0.5em">iphone2win</h1>
<p id="status-text"></p>
<div id="file-list"></div>
<div id="single-file"></div>
</body>
</html>
