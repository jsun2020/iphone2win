name: Build & Release (Windows)

# Manual runs upload a build artifact for testing. Pushing a v* tag also
# publishes the executable, portable ZIP, and SHA-256 checksums to Releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.10"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: flutter build windows --release

      - name: Build portable packages
        shell: pwsh
        run: .\scripts\package_windows_portable.ps1

      - name: Prepare versioned release assets
        shell: pwsh
        run: |
          $pubspec = Get-Content app\pubspec.yaml -Raw
          $match = [regex]::Match($pubspec, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) {
            throw 'Could not read the application version from app/pubspec.yaml.'
          }

          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match app version v$version."
          }

          $exeName = "iphone2win-$version-windows-x64-portable.exe"
          $zipName = "iphone2win-$version-windows-x64.zip"
          Copy-Item dist\iphone2win-portable.exe "dist\$exeName"
          Copy-Item dist\iphone2win-portable-files.zip "dist\$zipName"

          $hashLines = @(
            "{0}  {1}" -f (Get-FileHash "dist\$exeName" -Algorithm SHA256).Hash.ToLower(), $exeName
            "{0}  {1}" -f (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash.ToLower(), $zipName
          )
          Set-Content dist\SHA256SUMS.txt -Value $hashLines -Encoding ascii

          "release_version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "release_exe=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "release_zip=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: iphone2win-windows-x64
          path: |
            dist/iphone2win-*-windows-x64-portable.exe
            dist/iphone2win-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          ## iphone2win v$env:release_version

          Download the single-file EXE, or download and extract the ZIP before running `iphone2win.exe`.

          The packages are unsigned, so Windows SmartScreen may show a warning on first launch. The standard GitHub package does not include Apple proprietary drivers or the optional libimobiledevice tools.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content $notesFile -Value $notes -Encoding utf8

          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:GITHUB_REF_NAME --yes
          }

          gh release create $env:GITHUB_REF_NAME `
            "dist\$env:release_exe" `
            "dist\$env:release_zip" `
            'dist\SHA256SUMS.txt' `
            --title "iphone2win v$env:release_version" `
            --notes-file $notesFile `
            --generate-notes
